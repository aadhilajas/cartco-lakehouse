name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install hash-pinned test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/test.txt
          python -m pip check
      - name: Run unit tests
        run: python -m pytest tests/unit -v --junitxml=test-results/unit.xml
      - name: Save unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: warn

  file-integration:
    name: Local-file Iceberg transactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated SQLite catalog test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/file-integration.txt
          python -m pip check
      - name: Test actual Iceberg files and transaction conflicts
        run: python -m pytest tests/file_integration -v --junitxml=test-results/file-integration.xml
      - name: Save local-file evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-integration-results
          path: test-results/
          if-no-files-found: warn

  stack-baseline:
    name: Build, DAG imports and live stack baseline
    runs-on: ubuntu-latest
    needs: [unit-tests, file-integration]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare writable bind mounts for the CI user
        run: |
          mkdir -p data airflow/logs
          echo "AIRFLOW_UID=$(id -u)" >> "$GITHUB_ENV"
      - name: Build Airflow and pinned-source MinIO images
        run: docker compose build
      - name: Import real DAGs and check dependency graphs
        run: >-
          docker compose run --rm --no-deps
          -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/cartco-dag-check.db
          --entrypoint python airflow-scheduler /opt/airflow/scripts/diagnostics/check_dags.py
      - name: Start a fresh stack
        run: docker compose up -d
      - name: Exercise versioned three-source replay, legacy DAGs and integration tests
        run: bash scripts/ci/ci_baseline.sh
      - name: Capture stack diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps -a > test-results/compose-ps.txt
          docker compose logs --no-color > test-results/compose.log 2>&1
          docker cp cartco-airflow-scheduler:/tmp/cartco-integration.xml test-results/integration.xml || true
      - name: Save stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-baseline-results
          path: test-results/
          if-no-files-found: warn
      - name: Tear down the disposable CI stack
        if: always()
        run: docker compose down -v
