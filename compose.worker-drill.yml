# Use only with compose.recovery.yml and restored drill volumes.
services:
  verifier:
    volumes:
      - runtime:/opt/airflow/data
      - ./ingestion:/opt/airflow/ingestion:ro
      - ./acceptance/dags:/opt/airflow/dags:ro
    environment:
      CARTCO_DRILL_ID: ${CARTCO_DRILL_ID:?Set unique drill ID}
  recovery-scheduler:
    image: cartco/airflow:2.9.0
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__OPENLINEAGE__DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CARTCO_DRILL_ID: ${CARTCO_DRILL_ID:?Set unique drill ID}
      CARTCO_RUNTIME_MODE: delivered
      CARTCO_RUNTIME_INVENTORY_MODE: none
      CARTCO_RUNTIME_ALLOW_EMPTY_INIT: "false"
      CARTCO_RUNTIME_INPUT_ROOT: /opt/airflow/data/drill-deliveries/${CARTCO_DRILL_ID}
      CARTCO_RUNTIME_WORK_ROOT: /opt/airflow/data/drill-runs/${CARTCO_DRILL_ID}
      CARTCO_DRILL_MARKER: /opt/airflow/data/drill-runs/${CARTCO_DRILL_ID}/worker-marker.json
      OPENLINEAGE_URL: http://marquez-api:5000
      OPENLINEAGE_NAMESPACE: cartco-lakehouse
    volumes:
      - runtime:/opt/airflow/data
      - ./acceptance/dags:/opt/airflow/dags:ro
      - ./scripts:/opt/airflow/scripts:ro
      - ./pipeline:/opt/airflow/pipeline:ro
      - ./ingestion:/opt/airflow/ingestion:ro
      - ./transforms:/opt/airflow/transforms:ro
      - ./lineage:/opt/airflow/lineage:ro
      - ./docs/schemas:/opt/airflow/docs/schemas:ro
      - ${CARTCO_RECOVERY_EVIDENCE:?Set evidence directory}:/evidence
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 5s
      timeout: 5s
      retries: 60
