# CartCo lakehouse — local data-platform stack.
#
# Scope note (deliberate, deadline-driven):
#   * PySpark runs in LOCAL mode inside the Airflow image (see Dockerfile.airflow)
#     rather than a separate Spark cluster — fewer moving parts / less failure surface.
#   * Lineage (OpenLineage + Marquez) is DEFERRED to Week 2.
#
# Services: minio, mc (bucket init), iceberg-rest, postgres, airflow-init,
#           airflow-webserver, airflow-scheduler (LocalExecutor, no Celery/Redis).

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: cartco/airflow:2.9.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Expose the scheduler's HTTP health endpoint on :8974 for the container healthcheck.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # S3 / MinIO credentials so PySpark & PyIceberg can reach object storage.
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://minio:9000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./transforms:/opt/airflow/transforms
    - ./data:/opt/airflow/data
    - ./airflow/logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  minio:
    image: minio/minio:latest
    container_name: cartco-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: create the cartco-lakehouse bucket, then exit.
  mc:
    image: minio/mc:latest
    container_name: cartco-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/cartco-lakehouse &&
      mc ls local &&
      echo 'Bucket cartco-lakehouse ready';
      "
    restart: "no"

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: cartco-iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://cartco-lakehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  postgres:
    image: postgres:14
    container_name: cartco-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: initialize the Airflow metadata DB and create the admin user.
  airflow-init:
    <<: *airflow-common
    container_name: cartco-airflow-init
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create
      --username airflow --password airflow
      --firstname CartCo --lastname Admin
      --role Admin --email admin@cartco.local
      || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: cartco-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: cartco-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  postgres-data:
