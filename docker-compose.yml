# CartCo lakehouse — local data-platform stack.
#
# Scope note (deliberate, deadline-driven):
#   * Implemented jobs use PyArrow/PyIceberg inside the Python 3.11 Airflow image.
#   * Shopify, Amazon and Gold emit table-level lineage; live verification is required.
#
# Services: minio, mc (bucket init), iceberg-rest, postgres, airflow-init,
#           airflow-webserver, airflow-scheduler (LocalExecutor, no Celery/Redis),
#           marquez-db, marquez-api, marquez-web (local-only lineage backend/UI).

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: cartco/airflow:2.9.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Expose the scheduler's HTTP health endpoint on :8974 for the container healthcheck.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # New DAG is paused/manual; fixture generation and empty initialization are opt-in.
    CARTCO_RUNTIME_MODE: "${CARTCO_RUNTIME_MODE:-delivered}"
    CARTCO_RUNTIME_INVENTORY_MODE: "${CARTCO_RUNTIME_INVENTORY_MODE:-none}"
    CARTCO_RUNTIME_ALLOW_EMPTY_INIT: "${CARTCO_RUNTIME_ALLOW_EMPTY_INIT:-false}"
    CARTCO_RUNTIME_ROWS_PER_SOURCE: "${CARTCO_RUNTIME_ROWS_PER_SOURCE:-}"
    CARTCO_RUNTIME_WORK_ROOT: "${CARTCO_RUNTIME_WORK_ROOT:-/opt/airflow/data/versioned}"
    CARTCO_RUNTIME_INPUT_ROOT: "${CARTCO_RUNTIME_INPUT_ROOT:-/opt/airflow/data/deliveries}"
    ICEBERG_CATALOG_URI: http://iceberg-rest:8181
    S3_ENDPOINT: http://minio:9000
    # S3 / MinIO credentials for PyIceberg object storage.
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://minio:9000
    # OpenLineage emission target (lineage/emitter.py). Left unset, or
    # pointed at an unreachable host, the emitter logs and no-ops instead of
    # failing the task -- see lineage/emitter.py's module docstring.
    OPENLINEAGE_URL: http://marquez-api:5000
    OPENLINEAGE_NAMESPACE: cartco-lakehouse
    # apache/airflow:2.9.0 bundles apache-airflow-providers-openlineage,
    # which auto-emits its own (dataset-less) run events for every task via
    # an Airflow listener. Verified live: it produced empty
    # inputDatasetVersions/outputDatasetVersions for these BashOperator/
    # PythonOperator tasks (it has no generic extractor for arbitrary
    # scripts), duplicating the job/run rows this project's manual
    # lineage/emitter.py already emits with real dataset lineage attached.
    # Disabled here so cartco-lakehouse has exactly one lineage source of
    # truth instead of two overlapping, differently-populated ones.
    AIRFLOW__OPENLINEAGE__DISABLED: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./transforms:/opt/airflow/transforms
    - ./lineage:/opt/airflow/lineage
    - ./docs/schemas:/opt/airflow/docs/schemas:ro
    - ./pipeline:/opt/airflow/pipeline
    - ./scripts:/opt/airflow/scripts
    - ./tests:/opt/airflow/tests
    - ./pytest.ini:/opt/airflow/pytest.ini
    - ./conftest.py:/opt/airflow/conftest.py
    - ./data:/opt/airflow/data
    - ./airflow/logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: cartco/minio:source-7aac2a2c
    container_name: cartco-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: create the cartco-lakehouse bucket, then exit.
  mc:
    image: cartco/minio:source-7aac2a2c
    container_name: cartco-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/cartco-lakehouse &&
      mc ls local &&
      echo 'Bucket cartco-lakehouse ready';
      "
    restart: "no"

  iceberg-rest:
    image: tabulario/iceberg-rest@sha256:3b7d31bdfec626b68e97531c9778a1b9119659e456fe28545a49f6aa6a9ce472
    container_name: cartco-iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://cartco-lakehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  postgres:
    image: library/postgres@sha256:834a046089d76edd1d2e81c4741f3ad5d1853646ededc86c2708936aad31c1ed
    container_name: cartco-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: initialize the Airflow metadata DB and create the admin user.
  airflow-init:
    <<: *airflow-common
    container_name: cartco-airflow-init
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create
      --username airflow --password airflow
      --firstname CartCo --lastname Admin
      --role Admin --email admin@cartco.local
      || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: cartco-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: cartco-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Marquez's own metadata store. Deliberately separate from the Airflow
  # `postgres` service above -- Marquez manages its own schema/migrations
  # and reusing Airflow's metadata DB would couple two unrelated schemas.
  # Not exposed to the host: only marquez-api talks to it.
  marquez-db:
    image: library/postgres@sha256:834a046089d76edd1d2e81c4741f3ad5d1853646ededc86c2708936aad31c1ed
    container_name: cartco-marquez-db
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "marquez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local-only OpenLineage backend: receives the events emitted by
  # lineage/emitter.py and stores the job/dataset/run graph.
  marquez-api:
    image: marquezproject/marquez@sha256:0721c976cff17d8b14f7949d85d6dac9c7ea37cb9fe857caa19833730fcb1a50
    container_name: cartco-marquez-api
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      marquez-db:
        condition: service_healthy
    # Marquez runs its Postgres migrations on startup; if it starts racing
    # marquez-db's readiness this lets Compose bring it back up rather than
    # leaving it dead.
    restart: on-failure

  # Web UI for browsing the lineage graph at http://localhost:3000.
  marquez-web:
    image: marquezproject/marquez-web@sha256:7312112ca0e611b0a37b00d3da6a677485ae4a97622b23d3ae24d849a927868b
    container_name: cartco-marquez-web
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - marquez-api

volumes:
  minio-data:
  postgres-data:
  marquez-db-data:
