apiVersion: 1
datasources:
  - name: CartCo Airflow health
    uid: cartco-airflow-health
    type: postgres
    access: proxy
    url: airflow-db:5432
    user: cartco_grafana
    jsonData:
      database: airflow
      sslmode: disable
      postgresVersion: 1400
      timescaledb: false
    secureJsonData:
      password: $CARTCO_GRAFANA_DB_PASSWORD
    isDefault: true
    editable: false
