[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    file_integration: real local Iceberg/SQLite files; requires isolated requirements/file-integration.txt.
    integration: requires the live Docker stack (MinIO, Iceberg REST, Postgres, Airflow). Skipped unless RUN_INTEGRATION_TESTS=1 is set.
